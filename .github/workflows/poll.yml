name: Poll ianseo results

on:
  schedule:
    # every 5 minutes, offset from the herd minute marks
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and parse ianseo results
        run: python poller/poll.py

      - name: Commit updated results
        run: |
          git config user.name "ianseolive-bot"
          git config user.email "ianseolive-bot@users.noreply.github.com"
          git add data/results.json index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
